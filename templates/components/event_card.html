<article class="event-card">
    <a
        class="event-card__link"
        href="{% url 'events:public-detail' event_id=event.id %}"
        aria-label="Ver detalhes do evento {{ event.title }}"
    >
        <div class="event-card__media">
            {% if event.cover_image %}
                <img
                    class="event-card__image"
                    src="{{ event.cover_image.url }}"
                    alt=""
                    width="640"
                    height="400"
                    loading="lazy"
                    decoding="async"
                >
            {% else %}
                <div
                    class="event-card__image-placeholder"
                    aria-hidden="true"
                >
                    <span>TicketJá</span>
                </div>
            {% endif %}

            <span class="event-card__status">
                Inscrições
            </span>
        </div>

        <div class="event-card__content">
            <p class="event-card__sport">
                {{ event.get_sport_category_display }}
            </p>

            <h3 class="event-card__title">
                {{ event.title }}
            </h3>

            <dl class="event-card__details">
                <div>
                    <dt>Data</dt>

                    <dd>
                        <time
                            datetime="{{ event.event_datetime|date:'c' }}"
                        >
                            {{ event.event_datetime|date:"d/m/Y" }}
                        </time>
                    </dd>
                </div>

                <div>
                    <dt>Local</dt>

                    <dd>
                        {{ event.city }}/{{ event.state }}
                    </dd>
                </div>
            </dl>

            <div class="event-card__footer">
                <span class="event-card__price-pending">
                    Ver detalhes e ingressos
                </span>

                <span
                    class="event-card__action"
                    aria-hidden="true"
                >
                    →
                </span>
            </div>
        </div>
    </a>
</article>
